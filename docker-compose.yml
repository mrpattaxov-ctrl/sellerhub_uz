services:
  db:
    image: postgres:16-alpine
    restart: always
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=512MB
      -c work_mem=4MB
      -c effective_cache_size=1536MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c synchronous_commit=off
    shm_size: "256mb"
    environment:
      POSTGRES_DB: uzum
      POSTGRES_USER: uzum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uzum_secret_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzum"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  pgbouncer:
    # Connection pooler so app workers can multiplex many client connections
    # against a small real-Postgres pool. Lets us run multiple gunicorn
    # workers + the background worker without exhausting PG's max_connections.
    image: edoburu/pgbouncer:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # edoburu/pgbouncer uses DB_* env names (not DATABASES_*).
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: uzum
      DB_PASSWORD: ${POSTGRES_PASSWORD:-uzum_secret_change_me}
      DB_NAME: uzum
      # Transaction-mode pooling. App is already audited safe (no prepared
      # statements due to extensions.py prepare_threshold=None, no LISTEN/
      # NOTIFY, no temp-table sharing across txns).
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "2000"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "600"
      SERVER_LIFETIME: "3600"
      SERVER_RESET_QUERY: "DISCARD ALL"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits"
      # AUTH_TYPE=plain: client (app) sends password verbatim over the
      # private docker network, pgbouncer relays to PG. Safe because the
      # pgbouncer port is not exposed beyond compose's internal network.
      AUTH_TYPE: "plain"
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build: .
    restart: always
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${APP_TIMEZONE:-Asia/Tashkent}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
      APP_TZ_OFFSET_HOURS: ${APP_TZ_OFFSET_HOURS:-5}
      # Route DB traffic through PgBouncer (port 6432). Real PG remains
      # reachable on db:5432 inside the network for migrations / one-shot
      # tools that need session-scoped state.
      DATABASE_URL: postgresql+psycopg://uzum:${POSTGRES_PASSWORD:-uzum_secret_change_me}@pgbouncer:6432/uzum
      REDIS_URL: redis://redis:6379/0
      FINANCE_AUTO_REFRESH_WORKERS: "100"
      FINANCE_AUTO_SYNC_WORKERS_PER_SHOP: "3"
      # Pool sizes lowered — PgBouncer is now the heavy pooler. Each app
      # worker only needs a small client-side pool against pgbouncer.
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "30"
      # Ensure psycopg3 never tries server-side prepared statements
      # (PgBouncer transaction-mode would break them across conn reuse).
      DB_PREPARE_THRESHOLD: "none"
      ONBOARD_MAX_CONCURRENT_SYNCS: "20"
      # Uzum FBS OpenAPI token bucket. Refill 1→2 matches Uzum's REAL
      # advertised replenish-rate=2 (measured from prod 2026-06-17 via the
      # RATELIMIT log tag). Capacity kept at 1 (NOT Uzum's burst-capacity=2):
      # a burst of 2 let two writes fire sub-second, and when the live
      # list-poll + bg worker had just drained Uzum's bucket in the same
      # second, the 2nd confirm hit `remaining=0` → 429 (seen 2026-06-17).
      # Capacity=1 paces strictly one-at-a-time with zero burst, so we never
      # overshoot at the boundary. Shared per-token across FBS + finance +
      # products.
      #
      # Refill 2.0 → 1.7 → 1.1 (Abdulaziz 2026-07-14).
      #
      # 2.0 rode Uzum's advertised replenish-rate exactly, i.e. 100% of the
      # ceiling with ZERO headroom: every response came back with
      # `x-ratelimit-remaining: 0` and any jitter → 429.
      #
      # 1.7 was picked believing it restored the ~15% margin that
      # core/uzum_finance_openapi.py gives itself. That arithmetic was WRONG.
      # Measured from a live chip-switching session (07:23:36–07:24:05, 51
      # requests / 29.7s):
      #   • our real send rate  = 1.72 req/s  (bucket enforces the config)
      #   • Uzum `remaining`    = 0 or 1 on EVERY response, never 2
      # If Uzum truly replenished 2/s, sending 1.72/s would leave +0.18
      # tokens per cycle and its bucket would sit full. It never recovers →
      # Uzum's EFFECTIVE replenish is ~= our send rate, not the advertised 2.
      # Residual 429s (3) each landed right after an inter-arrival gap below
      # the nominal 0.588s (measured: 0.510s, 0.551s, 0.556s) — i.e. jitter
      # eating a margin that was ~0%.
      #
      # What finance actually does (uzum_finance_openapi.py:53,455): the
      # bucket wait PLUS an extra `time.sleep(0.55)` between pages — the two
      # ADD UP, so finance really runs at ~0.8–1.1 req/s (≈50% headroom), not
      # 1.7. That is why it never 429s.
      #
      # 1.1 puts FBS on the same footing. It has to live in the BUCKET, not in
      # a per-caller sleep: finance is one sequential loop, but FBS has five
      # concurrent callers (list, count, invoice view, bg worker, label/akt
      # prefetch) that cannot see each other — only the shared bucket paces
      # them as one.
      #
      # Cost: gap 0.588s → 0.91s (page entry ~0.34s → ~1.0s).
      # Benefit: the 1.5s-per-429 interactive retries should go to zero.
      # Revert: set this back to "1.7".
      # TAJRIBA (Abdulaziz 2026-07-14): postavka yaratishdan oldingi identifikator
      # qo'riqchisini O'CHIRAMIZ — Uzum OpenAPI'si nima deyishini ko'rish uchun.
      # Sabab: Uzum PORTALI aynan shunday buyurtmani (ASL_BELGISI, values=[],
      # required=false) qabul qildi va накладная yaratdi (HAR t4, 116914758 → 200),
      # ya'ni guard'imiz noto'g'ri to'sayotgan bo'lishi mumkin.
      # Tajriba tugagach: "1" (yoki qatorni o'chirish).
      FBS_IDENTIFIER_GUARD: "0"
      UZUM_OPENAPI_BUCKET_CAPACITY: "1"
      UZUM_OPENAPI_BUCKET_REFILL_PER_SEC: "1.0"
      # Avto-slot LIVE switchover (Abdulaziz 2026-06-30): yangi decoupled
      # allokator (monitor→bus→allocator) endi ROSTDAN band qiladi; eski
      # per-invoice grabber o'chiriladi (ikkalasi live bo'lib urishmasin).
      # Qaytarish: MODE=dry (yoki off) + GRAB_LOOP=1.
      # OBSERVE (Abdulaziz 2026-07-08): detektorni yoqamiz, lekin allokator
      # BAND QILMAYDI (dry) — Telegramda «qancha slot topilyapti»ni ko'rish uchun.
      # Real booking'ga o'tish: MODE=live. (Ilgari live edi; 2026-07-06 pauza.)
      POSTAVKA_AUTOSLOT_MODE: "dry"
      POSTAVKA_GRAB_LOOP: "0"
      # ═══ YAKUNIY REJA (Abdulaziz 2026-07-09): DETEKTORSIZ avto-band ═══
      # Booking endi mustaqil `_postavka_booking_loop` (har invoice o'zi slotini
      # so'rab o'zini band qiladi). Eski event-allokator (monitor→bus→allocator)
      # RETIRE qilinadi — ikki tizim bir invoice'ni band qilib urishmasin:
      #   • AUTOSLOT_LOOP=0  → allokator konsumeri ishga tushmaydi.
      #   • AUTOSLOT_PUBLISH=0 → detektor bus'ga event chiqarmaydi (konsumersiz
      #     navbat to'lib memory-leak bo'lmasin). Detektor observe (digest) QOLADI.
      # Qaytarish (eski event-arxitektura): AUTOSLOT_LOOP=1 + AUTOSLOT_PUBLISH=1.
      POSTAVKA_AUTOSLOT_LOOP: "0"
      POSTAVKA_AUTOSLOT_PUBLISH: "0"
      # Slot-kuzatuv poll oralig'i. 1s × 15-pog'ona narvon = ~15 so'rov/s (eng
      # tez aniqlash). ⚠️ Bu HAJM 2026-07-03'da Uzum WAF IP-blokini (403) keltirgan
      # edi — app.py'dagi 403-cooldown himoya qiladi, lekin yana 403 kelsa intervalni
      # oshiring (masalan 5-15s) yoki narvon-pog'onasini kamaytiring.
      POSTAVKA_SLOT_WATCH_INTERVAL_SEC: "1"
      # POYGA RADARI (Abdulaziz 2026-07-06): tez detekt + parallel o'lchov.
      # =1 → har poll FAQAT 1 yengil so'rov; slot chiqsa 15-narvon PARALLEL o'lchaydi.
      # HOZIR O'CHIQ (=0): CHUQUR-PARALLEL sinovi ustun (pastga qara). Radar 2.5/s
      # tizimini qaytarish: FAST_RADAR=1 + DEEP_PARALLEL=0.
      POSTAVKA_FAST_RADAR: "1"
      # _SEC = TSIKL nishoni (fixed-rate, Abdulaziz 2026-07-06): har tekshiruv AYNAN
      # shu oraliqda takrorlanadi. So'rov vaqti tsikldan ayriladi → tezlik nishondan
      # OSHMAYDI. Chuqur rejimda 0.4s tsikl × 15 so'rov ≈ 37.5 so'rov/s.
      POSTAVKA_FAST_RADAR_SEC: "0.3"
      # STRAGGLER cutoff (Abdulaziz 2026-07-08): detektor ISSIQ so'rovlari
      # retry'siz, shu timeout bilan — >600ms cho'zilgan so'rov TASHLANADI va
      # o'sha sikl jimgina o'tkaziladi (90s qotish yo'q; keyingi sikl 300ms da).
      POSTAVKA_DETECT_TIMEOUT_SEC: "0.6"
      # DETECT-ONLY checker miqdori (Abdulaziz 2026-07-08): faqat 50 dona sig'adigan
      # slotlarni tekshiradi. Yangi timeFrom (yoki 50'gacha kattalashish) = bo'shash.
      POSTAVKA_DETECT_Q: "50"
      # ⚠️ CHUQUR-PARALLEL SINOV (Abdulaziz 2026-07-06): har poll 15-narvonni
      # PARALLEL o'lchaydi (detekt-darvozasiz) → «mavjud slot kattalashди» (o'sish)
      # ham tutiladi (radar buni o'tkazib yuborardi). NARX: ~37.5 so'rov/s — bu
      # 2026-07-03 IP-blok tezligidan ~10× baland! FAQAT SINOV: 403 kelsa app.py
      # cooldown (60s→5daq→15daq) IPni himoya qiladi. Qaytarish: =0.
      POSTAVKA_DEEP_PARALLEL: "1"
      # ⚠️ PIPELINE-RADAR SINOV (Abdulaziz 2026-07-06): eng USTUN rejim. Har
      # _INTERVAL_SEC'da YANGI 15-narvon o'lchov SUBMIT qiladi (oldingisini
      # KUTMASDAN, ustma-ust) → ~0.2s resolution → oraliqda o'tkazilgan
      # freeinglarni ham ko'radi. 0.2s × 15 = ~75 so'rov/s — FAQAT SINOV
      # (75/s uzoq ketsa BAN; 403-cooldown himoya qiladi). Qaytarish: =0.
      POSTAVKA_PIPELINE_RADAR: "0"
      POSTAVKA_PIPELINE_INTERVAL_SEC: "0.2"
      # ═══ DETECT-ONLY rejim (Abdulaziz 2026-07-08) — HAMMA yuqoridagidan USTUN ═══
      # Bitta qty=50 checker, har 10ms SUBMIT (kutmasdan) → ~100/s uzluksiz. 15-narvon
      # YO'Q. 600ms kesish YO'Q — so'rov erkin, 15s'da reap; >10s osilsa → Telegram
      # ALERT. Yangi 50-sig'ar slot = bo'shash → event → digest (odatdagidek).
      POSTAVKA_DETECT_ONLY: "1"
      POSTAVKA_DETECT_ONLY_INTERVAL_SEC: "0.01"
      POSTAVKA_DETECT_ONLY_TIMEOUT_SEC: "15"
      POSTAVKA_DETECT_WATCHDOG_SEC: "10"
      # YOQILDI (Abdulaziz 2026-07-08): DETECT-ONLY qty=50 @ 100/s, observe (dry).
      # To'xtatish: =1.
      POSTAVKA_SLOT_WATCH_PAUSED: "0"
      # ⛔ DETEKTOR O'CHIRILDI (Abdulaziz 2026-07-09): yangi avto-band protsessori
      # har invoice slotini O'ZI so'raydi — detektor KERAK EMAS. Butun slot-watch
      # loop'ni to'xtatadi (~100/s Uzum so'rovlari + detektor Telegram digesti
      # ham to'xtaydi). Qayta yoqish: =1.
      POSTAVKA_SLOT_WATCH_LOOP: "0"
      # ═══ AVTO-BAND PROTSESSORI (Abdulaziz 2026-07-09) — 10ms non-blocking ═══
      # Har invoice o'zi slotini so'rab (`time-slot/get`) topilsa o'zini band
      # qiladi (`time-slot/set`). Detektor ISHTIROK ETMAYDI. Navbat = waiting
      # avto-slot rejalari (postavka_grab_plan). LIVE = real band qiladi.
      #   • GET cheksiz (slot chiqquncha / muddat o'tguncha) — read-only, xavfsiz.
      #   • SET har invoice uchun FAQAT BIR MARTA → Uzum 3× budjet portlamaydi.
      # O'chirish: BOOKING_LOOP=0 yoki BOOKING_MODE=off. Sinov: BOOKING_MODE=dry.
      # Avto-band Telegram chat (30-daq xulosa + watchdog + kelajakdagi «band
      # qilardik» ping). Abdulaziz 2026-07-09: 8109426704 ga yo'naltirildi.
      POSTAVKA_SLOT_WATCH_TG_CHAT: "8109426704"
      # AUTOSLOT_URL qo'yilgani uchun band qilishни autoslot servisi bajaradi —
      # SellerHub'ning O'Z loop'i O'CHIQ (ikki tomon bir slotni urmasin).
      POSTAVKA_BOOKING_LOOP: "0"
      POSTAVKA_BOOKING_MODE: "dry"
      # Scheduler: har 10ms bitta invoice SUBMIT (non-blocking). Hard 1s timeout.
      POSTAVKA_BOOKING_INTERVAL_SEC: "0.01"
      POSTAVKA_BOOKING_TIMEOUT_SEC: "1.0"
      # Pile-up guard (uchayotgan so'rov shundan oshsa SUBMIT to'xtaydi) + navbatni
      # DB'dan qayta yuklash oralig'i + >Ns osilsa Telegram watchdog + soatlik digest.
      POSTAVKA_BOOKING_MAX_INFLIGHT: "100"
      POSTAVKA_BOOKING_REFRESH_SEC: "5"
      POSTAVKA_BOOKING_WATCHDOG_SEC: "10"
      POSTAVKA_BOOKING_DIGEST_MIN: "30"
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "4"
      - --threads
      - "16"
      - --timeout
      - "600"
      - --reload
      - app:app
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          memory: 6G
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .git/
            - .claude/
            - __pycache__/
            - "**/__pycache__/"
            - "*.pyc"
            - .venv/
            - venv/
            - data/
            - legacy/
            - migrations/versions/__pycache__/
            - node_modules/
            - .pytest_cache/
            - "*.xlsx"
            - "*.log"
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

volumes:
  pgdata:
  app_data:
