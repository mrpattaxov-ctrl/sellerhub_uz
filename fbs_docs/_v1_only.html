<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .row { display:flex; }
  .col { flex:1; padding:34px 30px; }
  .col.light { background:#eef1f7; }
  .col.dark  { background:#0b0f1a; }
  .col-h { text-align:center; font-weight:800; font-size:1.05rem; margin:0 0 22px; }
  .col.light .col-h { color:#1d2939; }
  .col.dark  .col-h { color:#e8edf5; }

  .imodal { position:relative; width:100%; border-radius:20px; overflow:hidden; }
  .imodal-x { position:absolute; top:14px; right:16px; z-index:3; width:32px; height:32px; border-radius:9px; border:0; cursor:pointer; font-size:1.25rem; line-height:1; display:grid; place-items:center; }
  .imodal-body { padding:18px 20px 22px; display:flex; flex-direction:column; gap:16px; }
  .ih { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding-right:44px; }
  .ih-title { margin:0; font-size:1.15rem; font-weight:800; }
  .akt-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:11px; border:0; font-size:.86rem; font-weight:700; white-space:nowrap; }
  .akt-btn svg { width:16px; height:16px; }
  .facts { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px 18px; padding:16px 18px; border-radius:15px; }
  .fact { display:flex; gap:11px; align-items:center; }
  .fact-ic { flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; }
  .fact-ic svg { width:17px; height:17px; }
  .fact-l { font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; opacity:.7; }
  .fact-v { font-size:.9rem; font-weight:700; margin-top:2px; }
  .fact.primary .fact-v { font-size:1.02rem; }
  .addr { display:flex; gap:13px; align-items:center; padding:15px 18px; border-radius:15px; }
  .addr-ic { flex:none; width:40px; height:40px; border-radius:11px; display:grid; place-items:center; }
  .addr-ic svg { width:19px; height:19px; }
  .addr-body { flex:1; min-width:0; }
  .addr-l { font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; opacity:.7; margin-bottom:3px; }
  .addr-v { font-size:.92rem; font-weight:700; }
  .edit-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:11px; font-size:.82rem; font-weight:700; white-space:nowrap; }
  .edit-btn svg { width:14px; height:14px; }
  .ohead { display:grid; grid-template-columns:46px minmax(0,1fr) 190px; align-items:center; border-radius:12px; padding:10px 16px; }
  .ohead-th { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .ohead-l { display:flex; gap:14px; }
  .ohead-r { text-align:right; }
  .ocard { display:grid; grid-template-columns:46px minmax(0,1fr) 190px; align-items:stretch; border-radius:15px; overflow:hidden; margin-top:10px; }
  .ocard-chk { display:grid; place-items:center; }
  .chk { width:22px; height:22px; border-radius:7px; }
  .ocard-left { padding:8px 16px 12px; min-width:0; }
  .onum { display:inline-flex; align-items:center; gap:4px; font-size:.86rem; padding:10px 0 8px; font-weight:700; }
  .onum-pre { opacity:.6; }
  .onum-box { padding:2px 8px; border-radius:7px; font-weight:800; color:#fff; }
  .pl { display:flex; align-items:center; gap:14px; min-height:64px; padding:8px 0; }
  .pl + .pl { border-top:1px solid; }
  .thumb { flex:none; width:54px; height:54px; border-radius:12px; display:grid; place-items:center; font-size:1.3rem; }
  .pinfo { min-width:0; flex:1; }
  .ptitle { font-weight:600; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pmeta { font-size:.7rem; opacity:.7; margin-top:3px; }
  .dpill { flex:none; min-width:58px; text-align:center; padding:5px 10px; border-radius:999px; font-weight:800; font-size:.74rem; }
  .rail { padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:9px; }
  .rail-it { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rail-k { font-size:.58rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; opacity:.6; }
  .rail-v { font-size:.8rem; font-weight:800; }
  .rail-sum { font-size:.98rem; font-weight:800; }
  .badge-ready { display:inline-flex; padding:3px 9px; border-radius:999px; font-size:.66rem; font-weight:800; }

  /* LIGHT — Classic Royal Blue */
  .light .imodal { background:#fff; border:1px solid #e3e9f7; box-shadow:0 30px 70px -28px rgba(30,50,120,.35); }
  .light .imodal-x { background:#eef2fb; color:#8aa0bc; }
  .light .ih-title { color:#101828; }
  .light .akt-btn { background:#4169E1; color:#fff; }
  .light .facts { background:#f8faff; border:1px solid rgba(65,105,225,.14); }
  .light .fact-ic { background:rgba(65,105,225,.10); color:#4169E1; }
  .light .fact-l { color:#5d7390; } .light .fact-v { color:#101828; }
  .light .fact.primary .fact-ic { background:rgba(65,105,225,.15); color:#4169E1; }
  .light .fact.primary .fact-v { color:#2f54c4; }
  .light .addr { background:#fff; border:1px solid rgba(65,105,225,.16); }
  .light .addr-ic { background:rgba(65,105,225,.10); color:#4169E1; }
  .light .addr-l { color:#5d7390; } .light .addr-v { color:#101828; }
  .light .edit-btn { background:rgba(65,105,225,.08); border:1px solid rgba(65,105,225,.35); color:#2f54c4; }
  .light .ohead { background:rgba(65,105,225,.07); border:1px solid rgba(65,105,225,.1); }
  .light .ohead-th { color:#2f54c4; }
  .light .ocard { background:#fff; border:1px solid #e8edf6; box-shadow:0 1px 3px rgba(65,105,225,.06); }
  .light .ocard-chk { background:#f8faff; box-shadow:inset -1px 0 0 #e8edf6; }
  .light .chk { border:2px solid #cdd9ee; background:#fff; }
  .light .onum-pre { color:#8aa0bc; } .light .onum-box { background:#4169E1; }
  .light .ptitle { color:#101828; } .light .pmeta { color:#5d7390; }
  .light .thumb { background:#f3f6fc; border:1px solid #e8edf6; }
  .light .pl + .pl { border-color:#eef2f8; }
  .light .dpill { background:rgba(65,105,225,.10); color:#2f54c4; }
  .light .rail { background:#f7f9ff; box-shadow:inset 1px 0 0 #e8edf6; }
  .light .rail-k { color:#8aa0bc; } .light .rail-v { color:#475467; } .light .rail-sum { color:#2f54c4; }
  .light .badge-ready { background:#ecfdf3; color:#027a48; }

  /* DARK — Classic Royal Blue */
  .dark .imodal { background:#1a1d27; border:1px solid #2b3346; box-shadow:0 40px 90px -30px #000; }
  .dark .imodal-x { background:rgba(26,29,39,.7); color:#64748b; }
  .dark .ih-title { color:#e8edf5; }
  .dark .akt-btn { background:#4169E1; color:#fff; }
  .dark .facts { background:#141d30; border:1px solid #2b3346; }
  .dark .fact-ic { background:rgba(99,132,255,.18); color:#8fb4ff; }
  .dark .fact-l { color:#94a3b8; } .dark .fact-v { color:#e8edf5; }
  .dark .fact.primary .fact-ic { background:rgba(99,132,255,.26); color:#b9d0ff; }
  .dark .fact.primary .fact-v { color:#9fc0ff; }
  .dark .addr { background:#1c2336; border:1px solid #2b3346; }
  .dark .addr-ic { background:rgba(99,132,255,.2); color:#b9d0ff; }
  .dark .addr-l { color:#94a3b8; } .dark .addr-v { color:#e8edf5; }
  .dark .edit-btn { background:rgba(99,132,255,.16); border:1px solid rgba(99,132,255,.42); color:#9fc0ff; }
  .dark .ohead { background:rgba(99,132,255,.12); border:1px solid rgba(99,132,255,.2); }
  .dark .ohead-th { color:#8fb4ff; }
  .dark .ocard { background:#1a1d27; border:1px solid #2d3148; }
  .dark .ocard-chk { background:#161b27; box-shadow:inset -1px 0 0 #2b3346; }
  .dark .chk { border:2px solid #3a4058; background:#161b27; }
  .dark .onum-pre { color:#7a849a; } .dark .onum-box { background:#4169E1; }
  .dark .ptitle { color:#e8edf5; } .dark .pmeta { color:#94a3b8; }
  .dark .thumb { background:#161c2b; border:1px solid #2b3346; }
  .dark .pl + .pl { border-color:#2b3346; }
  .dark .dpill { background:rgba(99,132,255,.2); color:#b9d0ff; }
  .dark .rail { background:#161b27; box-shadow:inset 1px 0 0 #2b3346; }
  .dark .rail-k { color:#7a849a; } .dark .rail-v { color:#aeb6c7; } .dark .rail-sum { color:#9fc0ff; }
  .dark .badge-ready { background:rgba(16,185,129,.16); color:#6ee7b7; }
</style></head>
<body>
<div class="row">
  <div class="col light"><div class="col-h">☀️ 1-VARIANT — Kunduzgi (Classic Royal Blue)</div><div id="L"></div></div>

  const ED='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  const products=[

</body></html>
