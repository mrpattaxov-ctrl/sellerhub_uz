<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Накладная modali — pastki qism, 5 variant</title>
<style>
  :root{
    --bg:#eef0f7; --card:#ffffff; --card2:#fafbff;
    --ink:#101828; --ink2:#475467; --mut:#8a93a6; --faint:#aab2c4;
    --line:#eef0f4; --line2:#e6e9f1;
    --brand:#6938ef; --brand-2:#8b5cf6; --brand-d:#5524d6;
    --brand-soft:rgba(105,56,239,.10); --brand-soft2:rgba(105,56,239,.16);
    --ok:#047857; --ok-bg:#ecfdf3; --danger:#b91c1c; --warn:#b45309;
    --r-card:18px; --r-sm:12px; --r-pill:999px;
    --sh-sm:0 1px 3px rgba(105,56,239,.07), 0 1px 2px rgba(16,24,40,.05);
    --sh-lg:0 30px 80px -20px rgba(50,30,120,.45);
  }
  [data-theme="dark"]{
    --bg:#0e1016; --card:#181b24; --card2:#1d212c;
    --ink:#e8edf6; --ink2:#aeb6c7; --mut:#7a849a; --faint:#5a647a;
    --line:#262b39; --line2:#2e3447;
    --brand:#8b6dff; --brand-2:#a78bfa; --brand-d:#7b4eff;
    --brand-soft:rgba(139,109,255,.14); --brand-soft2:rgba(139,109,255,.22);
    --ok:#34d399; --ok-bg:rgba(16,185,129,.14); --danger:#f87171; --warn:#fbbf24;
    --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh-lg:0 30px 80px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 82% -8%, rgba(105,56,239,.14), transparent 60%),
      radial-gradient(900px 520px at -10% 108%, rgba(139,92,246,.12), transparent 55%),
      var(--bg);
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:5rem}
  [data-theme="dark"] body{background:
    radial-gradient(1200px 600px at 82% -8%, rgba(139,109,255,.16), transparent 60%),
    radial-gradient(900px 520px at -10% 108%, rgba(139,109,255,.08), transparent 55%),
    linear-gradient(160deg,#0b0d13,#101219 56%,#0d0f16)}

  .bar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
    padding:.7rem 1.2rem;background:color-mix(in srgb,var(--card) 80%,transparent);
    backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line2)}
  .bar h1{font-size:.95rem;margin:0 1rem 0 0;font-weight:800;letter-spacing:-.01em}
  .bar .sp{flex:1}
  .jump{display:flex;gap:.35rem;flex-wrap:wrap}
  .jump a{font-size:.76rem;font-weight:700;text-decoration:none;color:var(--ink2);
    border:1px solid var(--line2);background:var(--card);padding:.36rem .7rem;border-radius:var(--r-pill);transition:.16s}
  .jump a:hover{color:#fff;background:var(--brand);border-color:var(--brand)}
  .tgl{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line2);
    background:var(--card);color:var(--ink);padding:.4rem .8rem;border-radius:var(--r-pill);
    font-size:.78rem;font-weight:700;cursor:pointer}

  .wrap{max-width:880px;margin:0 auto;padding:2rem 1.2rem 0}
  .vtag{display:flex;align-items:center;gap:.7rem;margin:2.6rem 0 1rem;scroll-margin-top:5rem}
  .vtag .n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:var(--brand);color:#fff;font-weight:800;font-size:.92rem;box-shadow:var(--sh-sm)}
  .vtag h2{margin:0;font-size:1.06rem;font-weight:800;letter-spacing:-.01em}
  .vtag p{margin:.1rem 0 0;font-size:.8rem;color:var(--mut);font-weight:600}
  .vtag .meta{flex:1}

  .modal{border-radius:var(--r-card);background:var(--card);box-shadow:var(--sh-lg);overflow:hidden;position:relative}
  .lbl{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .6rem;border-radius:var(--r-pill);
    font-size:.7rem;font-weight:800;line-height:1}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .icn{flex:none;display:grid;place-items:center}.icn svg{width:17px;height:17px}

  /* ===== AURORA TOP (fixed, liked) ===== */
  .head{position:relative;padding:1.3rem 1.4rem 1.5rem;
    background:linear-gradient(135deg,#6d3bf5 0%,#8b5cf6 48%,#a855f7 100%);overflow:hidden}
  .head::after{content:"";position:absolute;inset:0;
    background:radial-gradient(420px 200px at 12% -40%,rgba(255,255,255,.45),transparent 60%),
      radial-gradient(360px 220px at 96% 140%,rgba(56,189,248,.4),transparent 55%);
    mix-blend-mode:screen;pointer-events:none}
  .head .row{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
  .head .glabel{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .head h3{margin:.25rem 0 0;color:#fff;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .head .akt{margin-top:1rem;display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.05rem;border-radius:12px;
    background:rgba(255,255,255,.95);color:#5524d6;font-weight:800;font-size:.84rem;text-decoration:none;
    box-shadow:0 8px 22px rgba(40,15,90,.35);position:relative;z-index:2;transition:.16s}
  .head .akt:hover{transform:translateY(-1px)}
  .x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid transparent;display:grid;place-items:center;
    cursor:pointer;background:rgba(255,255,255,.18);transition:.16s}
  .x:hover{background:rgba(255,255,255,.34)}.x svg{width:17px;height:17px}
  .body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.85rem;margin-top:-1rem;position:relative;z-index:3}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
  .glass{background:color-mix(in srgb,var(--card) 70%,transparent);
    border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);backdrop-filter:blur(8px);
    border-radius:14px;padding:.7rem .8rem;box-shadow:var(--sh-sm)}
  .fact{display:flex;gap:.55rem;align-items:center}
  .fact .icn{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand)}
  .fact .v{font-size:.9rem;font-weight:750;color:var(--ink);margin-top:.12rem}
  .fact.prim .v{color:var(--brand)}
  .addr{display:flex;gap:.7rem;align-items:center}
  .addr .icn{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand)}
  .addr .av{font-size:.92rem;font-weight:700;color:var(--ink);margin-top:.12rem}
  .edit{flex:none;display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .85rem;border-radius:11px;
    border:1px solid color-mix(in srgb,var(--brand) 38%,transparent);background:var(--brand-soft);color:var(--brand);
    font-weight:750;font-size:.8rem;cursor:pointer;transition:.16s}
  .edit:hover{background:var(--brand);color:#fff}

  /* product cell shared */
  .prod{display:flex;gap:.7rem;align-items:center;min-width:0}
  .prod .img{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;
    background:linear-gradient(135deg,#dfe3ee,#c9cfdf)}
  [data-theme="dark"] .prod .img{background:linear-gradient(135deg,#2a3042,#222738)}
  .prod .nm{font-size:.84rem;font-weight:700;color:var(--ink);line-height:1.3;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .prod .sub{font-size:.7rem;color:var(--mut);font-weight:600;margin-top:.12rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ============ B1 — TABLE with per-row DONA column ============ */
  .b1 .ordwrap{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--card)}
  .b1 .ohead{display:flex;align-items:center;gap:.6rem;padding:.65rem .95rem;background:var(--card2);
    border-bottom:1px solid var(--line2)}
  .b1 .ohead .no{font-size:.84rem;font-weight:800}
  .b1 .ohead .tot{margin-left:auto;font-size:.9rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
  .b1 table{width:100%;border-collapse:collapse}
  .b1 thead th{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
    text-align:left;padding:.45rem .95rem}
  .b1 thead th.c{text-align:center;width:80px}
  .b1 tbody td{padding:.55rem .95rem;border-top:1px solid var(--line)}
  .b1 td.c{text-align:center}
  .b1 .dona{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 .5rem;
    border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums}

  /* ============ B2 — order header bar + rows with dona chip ============ */
  .b2 .ordwrap{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--card)}
  .b2 .ohead{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;
    background:linear-gradient(90deg,var(--brand-soft),transparent);border-bottom:1px solid var(--line2)}
  .b2 .ohead .no{font-size:.86rem;font-weight:800}
  .b2 .ohead .tot{margin-left:auto;text-align:right}
  .b2 .ohead .tot .s{font-size:.92rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
  .b2 .ohead .tot .q{font-size:.68rem;color:var(--mut);font-weight:700}
  .b2 .line{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem}
  .b2 .line+.line{border-top:1px solid var(--line)}
  .b2 .chip{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:.25rem;padding:.3rem .6rem;border-radius:999px;
    background:var(--card2);border:1px solid var(--line2);color:var(--ink2);font-weight:800;font-size:.76rem;font-variant-numeric:tabular-nums}
  .b2 .chip b{color:var(--brand)}

  /* ============ B3 — compact list, circular dona badge, footer total ============ */
  .b3 .ordwrap{border:1px solid var(--line2);border-radius:16px;background:var(--card);overflow:hidden}
  .b3 .ohead{display:flex;align-items:center;gap:.6rem;padding:.6rem .95rem}
  .b3 .ohead .no{font-size:.82rem;font-weight:800;color:var(--ink2)}
  .b3 .line{display:flex;align-items:center;gap:.7rem;padding:.5rem .95rem}
  .b3 .line+.line{border-top:1px solid var(--line)}
  .b3 .badge{flex:none;margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--brand);color:#fff;font-weight:800;font-size:.8rem;box-shadow:0 4px 10px rgba(105,56,239,.3)}
  .b3 .foot{display:flex;align-items:center;gap:.6rem;padding:.7rem .95rem;background:var(--card2);
    border-top:1px solid var(--line2)}
  .b3 .foot . q{font-size:.78rem;font-weight:700;color:var(--ink2)}
  .b3 .foot .s{margin-left:auto;font-size:1.02rem;font-weight:850;color:var(--brand);font-variant-numeric:tabular-nums}

  /* ============ B4 — summary card on top + clean item rows ============ */
  .b4 .sum-card{display:flex;align-items:center;gap:1rem;padding:.9rem 1.1rem;border-radius:16px;
    background:linear-gradient(135deg,var(--brand-soft),var(--card2));border:1px solid var(--line2);margin-bottom:.7rem}
  .b4 .sum-card .no{font-size:.92rem;font-weight:850}
  .b4 .sum-card .big{margin-left:auto;text-align:right}
  .b4 .sum-card .big .s{font-size:1.25rem;font-weight:850;color:var(--brand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .b4 .sum-card .big .q{font-size:.7rem;color:var(--mut);font-weight:700}
  .b4 .line{display:flex;align-items:center;gap:.7rem;padding:.6rem .2rem}
  .b4 .line+.line{border-top:1px solid var(--line)}
  .b4 .q{flex:none;margin-left:auto;font-size:.82rem;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .b4 .q span{color:var(--mut);font-weight:700}

  /* ============ B5 — invoice/receipt line style with leaders ============ */
  .b5 .ordwrap{border:1px dashed var(--line2);border-radius:16px;background:var(--card);padding:.4rem 1rem .9rem}
  .b5 .ohead{display:flex;align-items:center;gap:.6rem;padding:.65rem .1rem .55rem;border-bottom:2px dashed var(--line2);margin-bottom:.4rem}
  .b5 .ohead .no{font-size:.82rem;font-weight:800}
  .b5 .line{display:flex;align-items:center;gap:.6rem;padding:.5rem .1rem}
  .b5 .line .lead{flex:1;border-bottom:1px dotted var(--line2);margin:0 .3rem;transform:translateY(4px)}
  .b5 .mult{flex:none;font-weight:800;font-size:.84rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .b5 .mult span{color:var(--mut);font-weight:700;font-size:.74rem}
  .b5 .foot{display:flex;align-items:baseline;gap:.6rem;padding:.7rem .1rem 0;margin-top:.3rem;border-top:2px dashed var(--line2)}
  .b5 .foot .t{font-size:.8rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
  .b5 .foot .s{margin-left:auto;font-size:1.15rem;font-weight:850;color:var(--brand);font-variant-numeric:tabular-nums}

  .foot{max-width:880px;margin:3rem auto 0;padding:1.2rem;text-align:center;color:var(--mut);font-size:.8rem}
  @media(max-width:560px){.facts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="bar">
  <h1>Aurora top · pastki qism 5 variant</h1>
  <nav class="jump">
    <a href="#b1">1 Jadval</a>
    <a href="#b2">2 Header-bar</a>
    <a href="#b3">3 Badge</a>
    <a href="#b4">4 Summary</a>
    <a href="#b5">5 Chek</a>
  </nav>
  <span class="sp"></span>
  <button class="tgl" id="themeBtn">🌙 Tungi</button>
</div>

<div class="wrap" id="app"></div>

<script>
  // ----- shared SVG icons -----
  const I = {
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    print:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    pen:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  };

  // ----- shared data -----
  const items = [
    {emoji:'🧲', nm:"Stresga qarshi magnit, 2 dona (O'lcham: 2.5sm)", sub:"BLUMMY-MAGNIT2-25 · ШК 1000007817150", qty:1},
    {emoji:'🧲', nm:"Stresga qarshi magnit, 2 dona (O'lcham: 3.5sm)", sub:"BLUMMY-MAGNIT2-35 · ШК 1000007817167", qty:1},
    {emoji:'📿', nm:"Ayollar zanjiri — nafis aksessuar (Rang: Malla)", sub:"BLUMMY-ЦЕПОЧКА-РЫЖИЙ · ШК 1000103129447", qty:1},
  ];
  const ORD = {no:"№110744298", status:"Jo'natishga tayyor", total:"37 950 UZS", qty:3};

  const prod = it => `<div class="prod"><div class="img">${it.emoji}</div>
    <div style="min-width:0"><div class="nm">${it.nm}</div><div class="sub">${it.sub}</div></div></div>`;

  // ----- AURORA TOP (kept) -----
  const TOP = `
    <div class="head">
      <div class="row">
        <div><div class="glabel">Накладная</div><h3>№120000997273</h3></div>
        <button class="x">${I.close}</button>
      </div>
      <a class="akt" href="#">${I.print} Акт отправки</a>
    </div>
    <div class="body">
      <div class="facts">
        <div class="glass fact"><div class="icn">${I.clock}</div><div><div class="lbl">Vaqt slot</div><div class="v">10.06 · 11:00–16:00</div></div></div>
        <div class="glass fact"><div class="icn">${I.cal}</div><div><div class="lbl">Yaratilgan</div><div class="v">09.06.2026, 19:25</div></div></div>
        <div class="glass fact prim"><div class="icn">${I.money}</div><div><div class="lbl">To'liq summa</div><div class="v">37 950 UZS</div></div></div>
        <div class="glass fact"><div class="icn">${I.box}</div><div><div class="lbl">Ombor</div><div class="v">Sergeli</div></div></div>
      </div>
      <div class="glass addr">
        <div class="icn">${I.pin}</div>
        <div style="flex:1;min-width:0"><div class="lbl">Qabul punkti</div><div class="av">Toshkent sh., Yunusobod tumani, 3-kvartal, 23-uy</div></div>
        <button class="edit">${I.pen} Изменить</button>
      </div>`; // body left OPEN — bottom variant + </div> appended per modal

  // ----- 5 BOTTOM variants -----
  const B = {};

  // B1 — table with per-row DONA column
  B.b1 = `<div class="b1"><div class="ordwrap">
    <div class="ohead"><span class="no">${ORD.no}</span><span class="pill ok">${ORD.status}</span><span class="tot">${ORD.total}</span></div>
    <table>
      <thead><tr><th>Mahsulot</th><th class="c">Dona</th></tr></thead>
      <tbody>${items.map(it=>`<tr><td>${prod(it)}</td><td class="c"><span class="dona">${it.qty}</span></td></tr>`).join("")}</tbody>
    </table>
  </div></div>`;

  // B2 — order header bar + dona chip per row
  B.b2 = `<div class="b2"><div class="ordwrap">
    <div class="ohead"><span class="no">${ORD.no}</span><span class="pill ok">${ORD.status}</span>
      <span class="tot"><div class="s">${ORD.total}</div><div class="q">${ORD.qty} dona</div></span></div>
    ${items.map(it=>`<div class="line">${prod(it)}<span class="chip"><b>${it.qty}</b> dona</span></div>`).join("")}
  </div></div>`;

  // B3 — circular dona badge + footer total
  B.b3 = `<div class="b3"><div class="ordwrap">
    <div class="ohead"><span class="no">${ORD.no}</span><span class="pill ok">${ORD.status}</span></div>
    ${items.map(it=>`<div class="line">${prod(it)}<span class="badge">${it.qty}</span></div>`).join("")}
    <div class="foot"><span class="q">Jami ${ORD.qty} dona</span><span class="s">${ORD.total}</span></div>
  </div></div>`;

  // B4 — summary card on top + clean rows
  B.b4 = `<div class="b4">
    <div class="sum-card"><span class="no">${ORD.no}</span><span class="pill ok">${ORD.status}</span>
      <span class="big"><div class="s">${ORD.total}</div><div class="q">${ORD.qty} dona</div></span></div>
    ${items.map(it=>`<div class="line">${prod(it)}<span class="q">${it.qty} <span>dona</span></span></div>`).join("")}
  </div>`;

  // B5 — receipt line style
  B.b5 = `<div class="b5"><div class="ordwrap">
    <div class="ohead"><span class="no">${ORD.no}</span><span class="pill ok">${ORD.status}</span></div>
    ${items.map(it=>`<div class="line">${prod(it)}<span class="lead"></span><span class="mult"><span>×</span>${it.qty}</span></div>`).join("")}
    <div class="foot"><span class="t">Jami · ${ORD.qty} dona</span><span class="s">${ORD.total}</span></div>
  </div></div>`;

  const META = {
    b1:["Jadval ustun","Toza jadval · MAHSULOT / DONA ustunlari · № va summa header'da (3-rasmga eng yaqin)"],
    b2:["Header-bar","Buyurtma sarlavha paneli (№+status+summa) · har qatorda «N dona» chip"],
    b3:["Dumaloq badge","Har qatorda dumaloq dona-belgi · pastda jami summa foot'i"],
    b4:["Summary karta","Tepada yirik summary karta (summa+status) · ostida toza qatorlar"],
    b5:["Chek uslubi","Накладная = chek: nuqtali yetaklovchi chiziq · ×N · pastda JAMI"],
  };

  const app = document.getElementById('app');
  app.innerHTML = Object.keys(B).map(k=>`
    <div class="vtag" id="${k}"><div class="n">${k[1]}</div>
      <div class="meta"><h2>${META[k][0]}</h2><p>${META[k][1]}</p></div></div>
    <div class="modal">${TOP}${B[k]}</div></div>`).join("");

  app.insertAdjacentHTML('beforeend',
    `<div class="foot">Pastki qismning 5 varianti · Aurora yuqori qism o'zgarmaydi. Bittasini tanlang → haqiqiy modalga (renderOrderCard) ko'chiramiz.<br>Eslatma: STATUS va SUMMA buyurtma darajasida (bir marta), DONA esa har qatorda (it.amount) — real ma'lumotга мос.</div>`);

  const btn=document.getElementById('themeBtn');
  btn.addEventListener('click',()=>{const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';
    h.setAttribute('data-theme',d?'light':'dark');btn.textContent=d?'🌙 Tungi':'☀️ Kunduzgi';});
</script>
</body>
