<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Накладная modali — yakuniy birlashtirilgan dizayn</title>
<style>
  :root{
    --bg:#eef0f7; --card:#ffffff; --card2:#fafbff;
    --ink:#101828; --ink2:#475467; --mut:#8a93a6;
    --line:#eef0f4; --line2:#e6e9f1;
    --brand:#6938ef; --brand-2:#8b5cf6; --brand-d:#5524d6;
    --brand-soft:rgba(105,56,239,.10); --brand-soft2:rgba(105,56,239,.16);
    --rail:#faf9ff;
    --ok:#047857; --ok-bg:#ecfdf3;
    --r-card:18px; --r-pill:999px;
    --sh-sm:0 1px 3px rgba(105,56,239,.07), 0 1px 2px rgba(16,24,40,.05);
    --sh-md:0 8px 24px rgba(16,24,40,.08);
    --sh-lg:0 30px 80px -20px rgba(50,30,120,.45);
  }
  [data-theme="dark"]{
    --bg:#0e1016; --card:#181b24; --card2:#1d212c;
    --ink:#e8edf6; --ink2:#aeb6c7; --mut:#7a849a;
    --line:#262b39; --line2:#2e3447;
    --brand:#8b6dff; --brand-2:#a78bfa; --brand-d:#7b4eff;
    --brand-soft:rgba(139,109,255,.14); --brand-soft2:rgba(139,109,255,.22);
    --rail:#1f2433;
    --ok:#34d399; --ok-bg:rgba(16,185,129,.14);
    --sh-sm:0 1px 3px rgba(0,0,0,.4); --sh-md:0 8px 24px rgba(0,0,0,.45); --sh-lg:0 30px 80px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 82% -8%, rgba(105,56,239,.14), transparent 60%),
      radial-gradient(900px 520px at -10% 108%, rgba(139,92,246,.12), transparent 55%),
      var(--bg);
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
    display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1.2rem 4rem}
  [data-theme="dark"] body{background:
    radial-gradient(1200px 600px at 82% -8%, rgba(139,109,255,.16), transparent 60%),
    radial-gradient(900px 520px at -10% 108%, rgba(139,109,255,.08), transparent 55%),
    linear-gradient(160deg,#0b0d13,#101219 56%,#0d0f16)}
  .tgl{position:fixed;top:1rem;right:1.1rem;z-index:90;display:inline-flex;align-items:center;gap:.45rem;
    border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:.4rem .8rem;border-radius:var(--r-pill);
    font-size:.78rem;font-weight:700;cursor:pointer;box-shadow:var(--sh-sm)}

  .modal{width:100%;max-width:1020px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--sh-lg);overflow:hidden}
  .lbl{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.24rem .6rem;border-radius:var(--r-pill);
    font-size:.7rem;font-weight:800;line-height:1;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .icn{flex:none;display:grid;place-items:center}.icn svg{width:17px;height:17px}

  /* ===== AURORA TOP ===== */
  .head{position:relative;padding:1.3rem 1.4rem 1.5rem;
    background:linear-gradient(135deg,#6d3bf5 0%,#8b5cf6 48%,#a855f7 100%);overflow:hidden}
  .head::after{content:"";position:absolute;inset:0;
    background:radial-gradient(420px 200px at 12% -40%,rgba(255,255,255,.45),transparent 60%),
      radial-gradient(360px 220px at 96% 140%,rgba(56,189,248,.4),transparent 55%);mix-blend-mode:screen;pointer-events:none}
  .head .row{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
  .head .glabel{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .head h3{margin:.25rem 0 0;color:#fff;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .head .akt{margin-top:1rem;display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.05rem;border-radius:12px;
    background:rgba(255,255,255,.95);color:#5524d6;font-weight:800;font-size:.84rem;text-decoration:none;
    box-shadow:0 8px 22px rgba(40,15,90,.35);position:relative;z-index:2;transition:.16s}
  .head .akt:hover{transform:translateY(-1px)}
  .x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid transparent;display:grid;place-items:center;
    cursor:pointer;background:rgba(255,255,255,.18);transition:.16s}
  .x:hover{background:rgba(255,255,255,.34)}.x svg{width:17px;height:17px}
  .body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.85rem;margin-top:-1rem;position:relative;z-index:3}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
  .glass{background:color-mix(in srgb,var(--card) 70%,transparent);
    border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);backdrop-filter:blur(8px);
    border-radius:14px;padding:.7rem .8rem;box-shadow:var(--sh-sm)}
  .fact{display:flex;gap:.55rem;align-items:center}
  .fact .icn{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand)}
  .fact .v{font-size:.9rem;font-weight:750;color:var(--ink);margin-top:.12rem}
  .fact.prim .v{color:var(--brand)}
  .addr{display:flex;gap:.7rem;align-items:center}
  .addr .icn{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand)}
  .addr .av{font-size:.92rem;font-weight:700;color:var(--ink);margin-top:.12rem}
  .edit{flex:none;display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .85rem;border-radius:11px;
    border:1px solid color-mix(in srgb,var(--brand) 38%,transparent);background:var(--brand-soft);color:var(--brand);
    font-weight:750;font-size:.8rem;cursor:pointer;transition:.16s}
  .edit:hover{background:var(--brand);color:#fff}

  /* ===== checkbox ===== */
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);background:var(--card);
    cursor:pointer;display:grid;place-items:center;transition:.15s;flex:none}
  .chk svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:.15s}
  .chk.on{background:var(--brand);border-color:var(--brand);box-shadow:0 3px 8px rgba(105,56,239,.35)}
  .chk.on svg{opacity:1;transform:scale(1)}
  .chk:hover{border-color:var(--brand)}

  /* ===== orders block ===== */
  .orders{display:flex;flex-direction:column;gap:.6rem}

  /* col template shared by header + card: chk | left | rail */
  .cols{display:grid;grid-template-columns:46px minmax(0,1fr) 198px}

  /* header strip (image 2) */
  .thead{background:var(--brand-soft);border-radius:12px;align-items:stretch}
  .thead .h-chk{display:flex;align-items:center;justify-content:center}
  .thead .h-left{display:flex;align-items:center;gap:.7rem;padding:.6rem .95rem}
  .thead .h-rail{padding:.6rem .95rem}
  .thead .t{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .thead .t-dona{width:64px;text-align:center}
  .thead .grow{flex:1}

  /* order card (V5 rail) */
  .ocard{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card);
    box-shadow:var(--sh-sm);transition:.16s;align-items:stretch}
  .ocard:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
  .ocard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft2),var(--sh-md)}
  .c-chk{display:flex;align-items:center;justify-content:center;background:var(--card2);
    box-shadow:inset -1px 0 0 var(--line2)}
  .ocard.sel .c-chk{background:var(--brand-soft)}
  .left{padding:.45rem .95rem .6rem}
  .ono{padding:.5rem 0 .35rem}
  .onum{display:inline-flex;align-items:center;font-size:.86rem;font-variant-numeric:tabular-nums}
  .onum-pre{color:var(--mut);font-weight:700}
  .onum-box{background:var(--brand);color:#fff;font-weight:850;padding:.1rem .44rem;border-radius:7px;margin-left:.2rem;
    letter-spacing:.01em;box-shadow:0 2px 7px rgba(105,56,239,.35)}
  .pl{display:flex;align-items:center;gap:.7rem;min-height:52px;padding:.3rem 0;min-width:0}
  .pl+.pl{border-top:1px solid var(--line)}
  .prod{display:flex;gap:.65rem;align-items:center;min-width:0;flex:1}
  .prod .img{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;
    background:linear-gradient(135deg,#dfe3ee,#c9cfdf)}
  [data-theme="dark"] .prod .img{background:linear-gradient(135deg,#2a3042,#222738)}
  .prod .nm{font-size:.82rem;font-weight:700;color:var(--ink);line-height:1.3;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .prod .sub{font-size:.68rem;color:var(--mut);font-weight:600;margin-top:.1rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dpill{flex:none;min-width:64px;display:inline-flex;align-items:center;justify-content:center;padding:.3rem .62rem;border-radius:999px;
    background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.76rem;font-variant-numeric:tabular-nums;white-space:nowrap}

  .rail{background:var(--rail);box-shadow:inset 1px 0 0 var(--line2);padding:.85rem 1rem;
    display:flex;flex-direction:column;justify-content:center;gap:.5rem}
  .rail .it{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
  .rail .k{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
  .rail .vq{font-size:.82rem;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .rail .big{font-size:1.04rem;font-weight:850;color:var(--brand);font-variant-numeric:tabular-nums}

  @media(max-width:760px){.facts{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){
    .cols{grid-template-columns:40px minmax(0,1fr)}
    .h-rail,.rail{grid-column:1 / -1;box-shadow:none;border-top:1px solid var(--line2);flex-direction:row;flex-wrap:wrap}
    .thead .h-rail{display:none}
    .dpill{display:none}
  }
</style>
</head>
<body>
<button class="tgl" id="themeBtn">🌙 Tungi</button>
<div class="modal" id="modal"></div>

<script>
  const I = {
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    print:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    pen:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  };

  const M25 = q=>({emoji:'🧲', nm:"Stresga qarshi magnit, 2 dona (O'lcham: 2.5sm)", sub:"BLUMMY-MAGNIT2-25 · ШК 1000007817150", q});
  const M35 = q=>({emoji:'🧲', nm:"Stresga qarshi magnit, 2 dona (O'lcham: 3.5sm)", sub:"BLUMMY-MAGNIT2-35 · ШК 1000007817167", q});
  const ZAN = q=>({emoji:'📿', nm:"Ayollar zanjiri — nafis aksessuar (Rang: Malla)", sub:"BLUMMY-ЦЕПОЧКА-РЫЖИЙ · ШК 1000103129447", q});

  const ORDERS = [
    {no:"№110744298", status:"Jo'natishga tayyor", sum:"37 950 UZS", sel:true,  items:[M25(1),M35(1),ZAN(1)]},
    {no:"№111073603", status:"Jo'natishga tayyor", sum:"15 000 UZS", sel:false, items:[M35(1)]},
    {no:"№111073760", status:"Jo'natishga tayyor", sum:"22 950 UZS", sel:true,  items:[ZAN(1),M25(1)]},
  ];
  const totQ = o => o.items.reduce((s,it)=>s+it.q,0);

  // buyurtma raqami: oxirgi 4 raqam ajratilgan binafsha quticha ichida (1-rasm uslubi)
  const onum = no => {
    const d = String(no).replace(/\D/g,'');
    const pre = d.slice(0,-4), box = d.slice(-4);
    return `<span class="onum"><span class="onum-pre">№${pre}</span><span class="onum-box">${box}</span></span>`;
  };

  const pl = it => `<div class="pl">
      <div class="prod"><div class="img">${it.emoji}</div>
        <div style="min-width:0"><div class="nm">${it.nm}</div><div class="sub">${it.sub}</div></div></div>
      <span class="dpill">${it.q} dona</span></div>`;

  const card = o => `<div class="cols ocard ${o.sel?'sel':''}">
      <div class="c-chk"><div class="chk ${o.sel?'on':''}" data-chk>${I.check}</div></div>
      <div class="left"><div class="ono">${onum(o.no)}</div>${o.items.map(pl).join("")}</div>
      <div class="rail">
        <div class="it"><span class="k">Status</span><span class="pill ok">${o.status}</span></div>
        <div class="it"><span class="k">Jami</span><span class="vq">${totQ(o)} dona</span></div>
        <div class="it"><span class="k">Summa</span><span class="big">${o.sum}</span></div>
      </div>
    </div>`;

  const HEADER = `<div class="cols thead">
      <div class="h-chk"><div class="chk on" data-chk data-all>${I.check}</div></div>
      <div class="h-left"><span class="t">№</span><span class="t">Mahsulot</span><span class="grow"></span><span class="t t-dona">Dona</span></div>
      <div class="h-rail"></div>
    </div>`;

  document.getElementById('modal').innerHTML = `
    <div class="head">
      <div class="row">
        <div><div class="glabel">Накладная</div><h3>№120000997273</h3></div>
        <button class="x">${I.close}</button>
      </div>
      <a class="akt" href="#">${I.print} Акт отправки</a>
    </div>
    <div class="body">
      <div class="facts">
        <div class="glass fact"><div class="icn">${I.clock}</div><div><div class="lbl">Vaqt slot</div><div class="v">10.06 · 11:00–16:00</div></div></div>
        <div class="glass fact"><div class="icn">${I.cal}</div><div><div class="lbl">Yaratilgan</div><div class="v">09.06.2026, 19:25</div></div></div>
        <div class="glass fact prim"><div class="icn">${I.money}</div><div><div class="lbl">To'liq summa</div><div class="v">75 900 UZS</div></div></div>
        <div class="glass fact"><div class="icn">${I.box}</div><div><div class="lbl">Ombor</div><div class="v">Sergeli</div></div></div>
      </div>
      <div class="glass addr">
        <div class="icn">${I.pin}</div>
        <div style="flex:1;min-width:0"><div class="lbl">Qabul punkti</div><div class="av">Toshkent sh., Yunusobod tumani, 3-kvartal, 23-uy</div></div>
        <button class="edit">${I.pen} Изменить</button>
      </div>
      <div class="orders">${HEADER}${ORDERS.map(card).join("")}</div>
    </div>`;

  const modal = document.getElementById('modal');
  modal.addEventListener('click', e=>{
    const c = e.target.closest('[data-chk]'); if(!c) return;
    if(c.dataset.all !== undefined){
      const on = !c.classList.contains('on');
      c.classList.toggle('on', on);
      modal.querySelectorAll('.ocard').forEach(card=>{
        card.classList.toggle('sel', on);
        card.querySelector('.chk').classList.toggle('on', on);
      });
      return;
    }
    c.classList.toggle('on');
    const row = c.closest('.ocard'); if(row) row.classList.toggle('sel', c.classList.contains('on'));
    // sync select-all
    const cards = [...modal.querySelectorAll('.ocard')];
    const all = cards.every(x=>x.classList.contains('sel'));
    modal.querySelector('[data-all]').classList.toggle('on', all);
  });

  const btn=document.getElementById('themeBtn');
  btn.addEventListener('click',()=>{const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';
    h.setAttribute('data-theme',d?'light':'dark');btn.textContent=d?'🌙 Tungi':'☀️ Kunduzgi';});
</script>
</body>
</html>
