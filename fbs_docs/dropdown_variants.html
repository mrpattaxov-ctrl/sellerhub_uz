<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>«Boshqa holatlar» dropdown — chiroyli variantlar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b11;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
.pvbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;background:#15151c;border-bottom:1px solid #26262f;color:#fff}
.pvbar h1{font-size:14px;margin:0;font-weight:800}
.pvbar .sub{font-size:12px;color:#8b8b97}
.seg{display:inline-flex;gap:4px;padding:4px;background:#0d0d12;border:1px solid #26262f;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#9a9aa6;font:700 13px/1 'Inter';padding:9px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:#111}
.note{max-width:1000px;margin:0 auto;padding:14px 22px 0;color:#9a9aa6;font-size:12.5px}
.note b{color:#dcdce4}
.frame{display:none;padding:30px 22px 220px}.frame.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.stage{max-width:1000px;margin:0 auto}
.shell{background:#F3F4F8;border-radius:24px;padding:26px}
.panel{background:#fff;border:1px solid #EBEBF1;border-radius:22px;padding:22px 24px;box-shadow:0 1px 2px rgba(20,16,40,.04),0 16px 40px -12px rgba(20,16,40,.12)}

/* filter bar (Soft, tasdiqlangan) */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.segtrack{display:inline-flex;align-items:center;gap:5px;padding:6px;background:#F3F4F8;border:1px solid #ECECF2;border-radius:16px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;font:700 .9rem 'Inter';color:#5A5762;cursor:pointer;transition:.15s;white-space:nowrap}
.st:hover{color:#1A1A22}
.st .n{min-width:20px;padding:0 7px;border-radius:999px;background:#fff;color:#7A7684;font:700 .72rem/20px 'Inter';text-align:center}
.st.on{background:#fff;color:#1A1A22;box-shadow:0 2px 8px rgba(20,16,40,.1),0 0 0 1px rgba(20,16,40,.04)}
.st.on .n{background:#1A1A22;color:#fff}
.st.nav{color:#7C3AED}.st.nav svg{width:16px;height:16px}

/* custom dropdown trigger (trek ichida, segmentdek) */
.dd{position:relative}
.dd-trigger{display:inline-flex;align-items:center;gap:10px;padding:11px 16px 11px 18px;border-radius:11px;font:700 .9rem 'Inter';color:#5A5762;cursor:pointer;transition:.15s;white-space:nowrap;border:0;background:transparent}
.dd-trigger:hover{color:#1A1A22;background:rgba(255,255,255,.6)}
.dd-trigger.active{background:#fff;color:#1A1A22;box-shadow:0 2px 8px rgba(20,16,40,.1),0 0 0 1px rgba(20,16,40,.04)}
.dd-trigger .cv{width:15px;height:15px;color:#9B98A5;transition:transform .2s}
.dd.open .dd-trigger .cv{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 9px);left:0;z-index:40;min-width:266px;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .17s ease,transform .17s cubic-bezier(.16,1,.3,1)}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}

/* ===== shared menu shell ===== */
.menu-card{background:#fff;border:1px solid #ECECF0;border-radius:16px;box-shadow:0 22px 50px -12px rgba(20,16,40,.28),0 4px 10px rgba(20,16,40,.06);padding:7px;overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;cursor:pointer;transition:.13s;font:600 .88rem 'Inter';color:#3A3A44}
.mi:hover{background:#F4F5F8}
.mi .lbl{flex:1 1 auto}
.mi .ct{padding:2px 9px;border-radius:999px;background:#EFEFF3;color:#6A6676;font:700 .72rem 'Inter'}
.mi .dot{width:9px;height:9px;border-radius:50%;flex:none}
.mi .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center}
.mi .ic svg{width:16px;height:16px}
.mlabel{font:700 .68rem 'Inter';text-transform:uppercase;letter-spacing:.06em;color:#A6A2AE;padding:9px 12px 5px}
.msep{height:1px;background:#F0F0F4;margin:5px 8px}

/* status ranglar */
.c-green{background:#E9FBF2;color:#0A7A52}.d-green{background:#10B981}
.c-blue{background:#EEF4FF;color:#2B54C9}.d-blue{background:#3B82F6}
.c-violet{background:#F3EEFF;color:#7C3AED}.d-violet{background:#8B5CF6}
.c-slate{background:#F1F3F7;color:#5A6477}.d-slate{background:#94A3B8}
.c-red{background:#FEECEB;color:#C0362B}.d-red{background:#EF4444}
.c-rose{background:#FFF1F4;color:#BE123C}.d-rose{background:#F43F5E}

/* B variant: selected check */
.mi .ck{margin-left:auto;width:18px;height:18px;color:#7C3AED;opacity:0}
.mi.sel{background:#F6F3FF}.mi.sel .ck{opacity:1}
.mi.sel .lbl{color:#5b2bc9}

/* hint rows under */
.rowshint{margin-top:16px;padding:22px;border:1px dashed #E2E2E8;border-radius:14px;text-align:center;color:#A6A2AE;font-size:.85rem}
</style>
</head>
<body>

<div class="pvbar">
  <h1>«Boshqa holatlar» menyu</h1>
  <span class="sub">3 chiroyli variant · menyu ochiq ko'rsatilgan</span>
  <div class="seg" id="seg">
    <button data-v="a" class="on">A · Toza list</button>
    <button data-v="b">B · Rangli + belgi</button>
    <button data-v="c">C · Bo'limli</button>
  </div>
</div>
<div class="note" id="note"></div>

<div class="frame on" id="f-a"><div class="stage"><div class="shell"><div class="panel" id="p-a"></div></div></div></div>
<div class="frame" id="f-b"><div class="stage"><div class="shell"><div class="panel" id="p-b"></div></div></div></div>
<div class="frame" id="f-c"><div class="stage"><div class="shell"><div class="panel" id="p-c"></div></div></div></div>

<script>
const TRUCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>';
const CV='<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
const CK='<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const I={
 truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
 in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
 hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M5 13a7 7 0 0 0 14 0V9"/></svg>',
 done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
 ret:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
};
// [label, count, colorKey, iconKey]
const SEC=[
 ['Доставлен',5,'green','done'],
 ['В пункте приёма',0,'blue','in'],
 ['В пункте выдачи',0,'violet','hand'],
 ['Завершён',235,'slate','done'],
 ['Отменён',268,'red','x'],
 ['Возврат',183,'rose','ret'],
];

const BAR=(menuHtml)=>`
  <div class="filters">
    <div class="segtrack">
      <span class="st">Новый <span class="n">0</span></span>
      <span class="st on">Сборка <span class="n">2</span></span>
      <span class="st nav">${TRUCK}Поставка</span>
      <span class="st">В пути <span class="n">0</span></span>
      <div class="dd open">
        <button class="dd-trigger active">Boshqa holatlar… ${CV}</button>
        <div class="menu"><div class="menu-card">${menuHtml}</div></div>
      </div>
    </div>
  </div>
  <div class="rowshint">— buyurtmalar jadvali shu yerda —</div>`;

// A · toza list (label + count)
document.getElementById('p-a').innerHTML=BAR(
 SEC.map(s=>`<div class="mi"><span class="lbl">${s[0]}</span><span class="ct">${s[1]}</span></div>`).join('')
);
// B · rangli ikonka + count + tanlangan belgi
document.getElementById('p-b').innerHTML=BAR(
 SEC.map((s,i)=>`<div class="mi ${i===2?'sel':''}"><span class="ic c-${s[2]}">${I[s[3]]}</span><span class="lbl">${s[0]}</span><span class="ct">${s[1]}</span>${CK}</div>`).join('')
);
// C · bo'limli (guruh sarlavhalari)
document.getElementById('p-c').innerHTML=BAR(
 `<div class="mlabel">Yetkazib berish</div>`+
 [SEC[0],SEC[1],SEC[2]].map(s=>`<div class="mi"><span class="dot d-${s[2]}"></span><span class="lbl">${s[0]}</span><span class="ct">${s[1]}</span></div>`).join('')+
 `<div class="msep"></div><div class="mlabel">Yakunlangan</div>`+
 [SEC[3]].map(s=>`<div class="mi"><span class="dot d-${s[2]}"></span><span class="lbl">${s[0]}</span><span class="ct">${s[1]}</span></div>`).join('')+
 `<div class="msep"></div><div class="mlabel">Bekor / qaytarish</div>`+
 [SEC[4],SEC[5]].map(s=>`<div class="mi"><span class="dot d-${s[2]}"></span><span class="lbl">${s[0]}</span><span class="ct">${s[1]}</span></div>`).join('')
);

// trigger toggle (har frame uchun)
document.querySelectorAll('.dd-trigger').forEach(t=>{
  t.addEventListener('click',e=>{e.stopPropagation();t.closest('.dd').classList.toggle('open');});
});
document.addEventListener('click',()=>document.querySelectorAll('.dd').forEach(d=>{
  // demo uchun ochiq qoldiramiz; real ilovada tashqariga bosilsa yopiladi
}));

const NOTES={
 a:'<b>A · Toza list</b> — soddа, oq yumaloq menyu, har holat nomi + count pill. Minimalist, tez. Trigger trek ichida segmentdek.',
 b:'<b>B · Rangli + belgi</b> — har holatga rangli ikonka (yetkazildi=yashil, bekor=qizil…), tanlangan holatda binafsha belgi (✓). Eng vizual va aniq.',
 c:'<b>C · Bo\'limli</b> — holatlar mantiqiy guruhlangan (Yetkazib berish / Yakunlangan / Bekor), kichik rangli nuqta bilan. Ko\'p holat uchun tartibli.'
};
const note=document.getElementById('note');note.innerHTML=NOTES.a;
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id==='f-'+b.dataset.v));
 note.innerHTML=NOTES[b.dataset.v];});
</script>
</body>
</html>
