<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pastki qator — ortiqcha matnsiz variantlar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b11;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
.pvbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;background:#15151c;border-bottom:1px solid #26262f;color:#fff}
.pvbar h1{font-size:14px;margin:0;font-weight:800}.pvbar .sub{font-size:12px;color:#8b8b97}
.seg{display:inline-flex;gap:4px;padding:4px;background:#0d0d12;border:1px solid #26262f;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#9a9aa6;font:700 13px/1 'Inter';padding:9px 13px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:#111}
.note{max-width:1080px;margin:0 auto;padding:14px 22px 0;color:#9a9aa6;font-size:12.5px}.note b{color:#dcdce4}
.wrap{padding:26px 22px 90px}.stage{max-width:1080px;margin:0 auto}
.shell{background:#F3F4F8;border-radius:24px;padding:24px}
.panel{background:#fff;border:1px solid #EBEBF1;border-radius:22px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,16,40,.04),0 16px 40px -12px rgba(20,16,40,.12)}

table{width:100%;border-collapse:separate;border-spacing:0 8px}
thead th{font:700 .66rem 'Inter';text-transform:uppercase;letter-spacing:.06em;color:#A6A2AE;text-align:left;padding:0 16px 4px}
thead th.r{text-align:right}
tbody td{background:#FBFBFD;padding:13px 16px;font-size:.84rem;border-top:1px solid #EFEFF3;border-bottom:1px solid #EFEFF3;color:#1A1A22}
tbody td:first-child{border-left:1px solid #EFEFF3;border-radius:14px 0 0 14px}
tbody td:last-child{border-right:1px solid #EFEFF3;border-radius:0 14px 14px 0;text-align:right;font-weight:800}
.tag{display:inline-block;padding:3px 10px;border-radius:7px;font:700 .67rem 'Inter'}
.tag.fbs{background:#EEF1FF;color:#3D5CCB}.tag.dbs{background:#FFF4D6;color:#9A6207}

/* footer */
.foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid #F0F0F4}
.count{font:700 .85rem 'Inter';color:#1A1A22}
.count .u{color:#8E8B97;font-weight:600}
.fresh{font:.78rem 'Inter';color:#A6A2AE;font-style:italic}
.controls{display:inline-flex;align-items:center;gap:16px;flex-wrap:wrap}
.psize{display:inline-flex;align-items:center;gap:8px;font:700 .8rem 'Inter';color:#56535F}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid #E6E6EC;background:#FBFBFD;color:#1A1A22;border-radius:10px;padding:8px 30px 8px 12px;font:700 .82rem 'Inter';cursor:pointer}
.sel .cv{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#9B98A5;pointer-events:none}
.pager{display:inline-flex;align-items:center;gap:8px}
.pgbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #E6E6EC;background:#fff;color:#3A3A44;border-radius:10px;padding:8px 14px;font:700 .8rem 'Inter';cursor:pointer}
.pgbtn:disabled{opacity:.45;cursor:default}
.pgbtn svg{width:14px;height:14px}
.pgnum{font:700 .82rem 'Inter';color:#56535F;padding:0 4px}
</style>
</head>
<body>
<div class="pvbar">
  <h1>Pastki qator — toza variantlar</h1>
  <span class="sub">texnik matn olib tashlandi · 4 variant</span>
  <div class="seg" id="seg">
    <button data-v="a" class="on">A · Eng toza</button>
    <button data-v="b">B · Buyurtma soni</button>
    <button data-v="c">C · Son + yangilanish</button>
    <button data-v="d">D · Markazda</button>
  </div>
</div>
<div class="note" id="note"></div>

<div class="wrap"><div class="stage"><div class="shell"><div class="panel">
  <table><thead><tr><th>№</th><th>Mahsulot</th><th>Sxema</th><th>Do'kon</th><th class="r">Summa</th></tr></thead>
  <tbody>
    <tr><td>№110388551</td><td>SKU: KROSSFT-SHALVAR5-СЕРЫЙ-L</td><td><span class="tag fbs">FBS</span></td><td>KrossFit</td><td>59 900 UZS</td></tr>
    <tr><td>№110373473</td><td>SKU: BLUMMY-ЦЕПОЧКАЛАР-РЫЖИЙ</td><td><span class="tag dbs">DBS</span></td><td>BLUMMY</td><td>7 950 UZS</td></tr>
  </tbody></table>
  <div id="foot"></div>
</div></div></div></div>

<script>
const CV='<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
const PREV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
const NEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
const PSIZE=`<span class="psize">Sahifada <span class="sel"><select><option>20</option><option>10</option><option>50</option></select>${CV}</span></span>`;
const PAGER=`<span class="pager"><button class="pgbtn" disabled>${PREV}Oldingi</button><span class="pgnum">1</span><button class="pgbtn">Keyingi ${NEXT}</button></span>`;
const COUNT=`<span class="count">2 <span class="u">ta buyurtma</span></span>`;
const FRESH=`<span class="fresh">18 daqiqa oldin yangilandi</span>`;

const FOOTS={
 a:`<div class="foot"><span></span><span class="controls">${PSIZE}${PAGER}</span></div>`,
 b:`<div class="foot">${COUNT}<span class="controls">${PSIZE}${PAGER}</span></div>`,
 c:`<div class="foot"><span style="display:flex;flex-direction:column;gap:3px">${COUNT}${FRESH}</span><span class="controls">${PSIZE}${PAGER}</span></div>`,
 d:`<div class="foot" style="justify-content:center"><span class="controls">${PAGER}${PSIZE}</span></div>`,
};
const NOTES={
 a:'<b>A · Eng toza</b> — hech qanday matn yo\'q, faqat «Sahifada [20▾]» + Oldingi/Keyingi (o\'ngda). Maksimal minimalizm.',
 b:'<b>B · Buyurtma soni</b> — chapda faqat «2 ta buyurtma», o\'ngda navigatsiya. Foydali son qoladi, texnik chiqindi yo\'q.',
 c:'<b>C · Son + yangilanish</b> — «2 ta buyurtma» + ostida «18 daqiqa oldin yangilandi». Son + ma\'lumot yangiligini bildiradi (Status/Endpoint olib tashlandi).',
 d:'<b>D · Markazda</b> — hech qanday meta yo\'q, faqat navigatsiya markazda: ◀ Oldingi · 1 · Keyingi ▶ · Sahifada. Eng balanslangan.'
};
const foot=document.getElementById('foot'),note=document.getElementById('note');
function render(v){foot.innerHTML=FOOTS[v];note.innerHTML=NOTES[v];}
render('a');
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
 render(b.dataset.v);});
</script>
</body>
</html>
