<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal amal-tugmalari — 5 variant</title>
<style>
  :root { --rb:#4169E1; --rb-d:#3556c9; --ink:#16182b; --mut:#8b90a3; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 80px;
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #dfe3ee; color: var(--ink);
  }
  h1 { text-align: center; font-size: 22px; font-weight: 850; letter-spacing: -.02em; margin: 0 0 6px; }
  .sub { text-align: center; color: #5a6072; font-size: 14px; margin: 0 0 36px; }
  .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 34px; }
  .variant-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800; color: var(--rb);
    background: #fff; border: 1px solid #d7deef; border-radius: 999px;
    padding: 5px 14px; margin-bottom: 12px;
  }
  .variant-label .n { background: var(--rb); color: #fff; width: 20px; height: 20px;
    border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
  .note { color: #5a6072; font-size: 12.5px; margin: 8px 2px 0; }

  /* Modal footer mock — total panel + button bar in a card */
  .card { background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 18px 50px -20px rgba(24,30,60,.35); }
  .total {
    display: flex; justify-content: space-between; align-items: center;
    background: #eef3ff; border-radius: 16px; padding: 15px 18px; margin: 16px 18px 4px;
  }
  .total .lbl { color: var(--rb); font-size: 14px; font-weight: 700; }
  .total .val { color: var(--rb); font-size: 23px; font-weight: 800; letter-spacing: -.02em; }

  .bar { display: flex; gap: 12px; padding: 16px 18px 20px; }
  .btn {
    flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center;
    gap: 9px; height: 52px; border: 0; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: filter .14s, transform .1s, box-shadow .18s, background .14s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* ══════════════ V1 — Soft refined (hozirgiga yaqin, sayqallangan) ══════════════ */
  .v1 .btn-primary { background: var(--rb); color: #fff; box-shadow: 0 8px 20px -8px rgba(65,105,225,.6); }
  .v1 .btn-primary:hover { background: var(--rb-d); box-shadow: 0 12px 26px -8px rgba(65,105,225,.7); }
  .v1 .btn-soft { background: #eef3ff; color: var(--rb); }
  .v1 .btn-soft:hover { background: #e0e8ff; }
  .v1 .btn-danger { background: #fdecec; color: #e23b3b; }
  .v1 .btn-danger:hover { background: #fbdcdc; }

  /* ══════════════ V2 — Pill outline (yumaloq, havodor, chiziqli) ══════════════ */
  .v2 .bar { gap: 10px; }
  .v2 .btn { border-radius: 999px; }
  .v2 .btn-primary { background: var(--rb); color: #fff; box-shadow: 0 10px 22px -10px rgba(65,105,225,.75); }
  .v2 .btn-primary:hover { background: var(--rb-d); }
  .v2 .btn-soft { background: #fff; color: var(--rb); border: 1.5px solid #c5d2f7; }
  .v2 .btn-soft:hover { background: #f4f7ff; border-color: var(--rb); }
  .v2 .btn-danger { background: #fff; color: #e23b3b; border: 1.5px solid #f6cdcd; }
  .v2 .btn-danger:hover { background: #fff5f5; border-color: #e23b3b; }

  /* ══════════════ V3 — Asosiy ustun (ierarxiya: Etiketka katta) ══════════════ */
  .v3 .btn-primary { flex: 1.9 1 0; background: var(--rb); color: #fff; box-shadow: 0 9px 22px -9px rgba(65,105,225,.7); }
  .v3 .btn-primary:hover { background: var(--rb-d); }
  .v3 .btn-soft { background: #eef3ff; color: var(--rb); }
  .v3 .btn-soft:hover { background: #e0e8ff; }
  .v3 .btn-danger { flex: 0 0 auto; padding: 0 18px; background: transparent; color: #b9bdca; }
  .v3 .btn-danger:hover { background: #fdecec; color: #e23b3b; }

  /* ══════════════ V4 — Icon-badge (fintech: rangli ikon chip) ══════════════ */
  .v4 .btn { justify-content: flex-start; padding: 0 16px; gap: 11px; }
  .v4 .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .v4 .ic svg { width: 16px; height: 16px; }
  .v4 .btn-primary { background: var(--rb); color: #fff; box-shadow: 0 8px 20px -8px rgba(65,105,225,.6); }
  .v4 .btn-primary .ic { background: rgba(255,255,255,.22); color: #fff; }
  .v4 .btn-primary:hover { background: var(--rb-d); }
  .v4 .btn-soft { background: #f4f6fb; color: var(--ink); }
  .v4 .btn-soft .ic { background: #e3e9ff; color: var(--rb); }
  .v4 .btn-soft:hover { background: #eef1f8; }
  .v4 .btn-danger { background: #f4f6fb; color: var(--ink); }
  .v4 .btn-danger .ic { background: #fde0e0; color: #e23b3b; }
  .v4 .btn-danger:hover { background: #fbeeee; }

  /* ══════════════ V5 — Elevated minimal (hairline + nozik soya) ══════════════ */
  .v5 .bar { gap: 10px; }
  .v5 .btn { background: #fff; border: 1px solid #e7eaf2; box-shadow: 0 2px 5px rgba(24,30,60,.05); color: var(--ink); }
  .v5 .btn:hover { box-shadow: 0 8px 18px -6px rgba(24,30,60,.16); }
  .v5 .btn-primary { background: var(--rb); border-color: var(--rb); color: #fff; box-shadow: 0 8px 20px -8px rgba(65,105,225,.55); }
  .v5 .btn-primary:hover { background: var(--rb-d); box-shadow: 0 12px 24px -8px rgba(65,105,225,.65); }
  .v5 .btn-soft svg { color: var(--rb); }
  .v5 .btn-danger { color: #e23b3b; }
  .v5 .btn-danger svg { color: #e23b3b; }
  .v5 .btn-danger:hover { border-color: #f6cdcd; background: #fff8f8; }
</style>
</head>
<body>
  <h1>Modal amal-tugmalari — 5 variant</h1>
  <p class="sub">Hammasi V3 dizaynga (Royal Blue, tekis, gradientsiz) mos. Birini tanlang.</p>
  <div class="wrap" id="wrap"></div>

<script>
  // SVG ikonlar (hozirgi modal bilan bir xil: printer · QR · ✕)
  const ICO = {
    print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
    qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
  };

  const VARIANTS = [
    { id:'v1', name:'Soft refined', note:'Hozirgi uslubning sayqallangan ko‘rinishi — Royal Blue to‘la, QR och-ko‘k, Bekor och-qizil. Eng tanish, xavfsiz.' },
    { id:'v2', name:'Pill outline', note:'Yumaloq «pill» tugmalar — asosiysi to‘la ko‘k, ikkitasi oq + rangli hoshiya. Havodor, yengil, zamonaviy.' },
    { id:'v3', name:'Asosiy ustun', note:'Ierarxiya: «Etiketka» kattaroq va dadil; QR — och-ko‘k; «Bekor» — ko‘zga tashlanmaydigan ghost (faqat hover‘da qizaradi). Asosiy amalga urg‘u.' },
    { id:'v4', name:'Icon-badge', note:'Har tugmada rangli ikon-chip (fintech uslubi), matn chapdan. Toza dashboard ko‘rinishi.' },
    { id:'v5', name:'Elevated minimal', note:'Oq tugmalar, ingichka hoshiya + nozik soya; asosiysi to‘la ko‘k va biroz «ko‘tarilgan». Sokin SaaS uslubi.' }
  ];

  function footer(){
    return `
      <div class="total"><span class="lbl">Jami summa</span><span class="val">37 950 UZS</span></div>
      <div class="bar">
        <button class="btn btn-danger"><span class="ic">${ICO.x}</span><span>Bekor qilish</span></button>
        <button class="btn btn-soft"><span class="ic">${ICO.qr}</span><span>QR chop etish</span></button>
        <button class="btn btn-primary"><span class="ic">${ICO.print}</span><span>Etiketka chop etish</span></button>
      </div>`;
  }
  // V4 ikonlari chip ichida bo‘lgani uchun .ic span ishlatiladi; boshqalarda
  // .ic span faqat svg'ni o'raydi (CSS .ic'ni V4'dan tashqari styllamaydi → oddiy svg).
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = VARIANTS.map(v => `
    <div>
      <span class="variant-label"><span class="n">${v.name === 'Soft refined' ? 1 : v.name==='Pill outline'?2:v.name==='Asosiy ustun'?3:v.name==='Icon-badge'?4:5}</span>${v.name}</span>
      <div class="card ${v.id}">${footer()}</div>
      <p class="note">${v.note}</p>
    </div>
  `).join('');
</script>
</body>
</html>
