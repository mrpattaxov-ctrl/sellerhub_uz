{# ── Bare layout for the order-detail page when shown inside a modal ──
   The orders list opens a single order in a centered modal via
   <iframe src="/fbs/<id>?embed=1">. That iframe must NOT carry the app
   chrome (sidebar/navbar/footer) — only the detail content. So instead of
   extending base.html, the detail template extends THIS minimal shell:
   same theme handling, Bootstrap (the cancel/IMEI modals need it) and the
   shared styles.css, transparent background so the parent modal card shows
   through, and the back-link hidden (the modal has its own × close).
   Blocks mirror base.html (extra_css / content) so the detail template
   renders unchanged in both layouts. #}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Sync theme from the same localStorage key base.html uses — the iframe
     is same-origin, so dark/light follows the parent automatically. #}
  <script>(function(){var t=localStorage.getItem('sh-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <title>SellerHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    html, body { background: transparent; }
    /* V3 hero modal kartasining chetiga yopishadi — padding yo'q. */
    body { margin: 0; padding: 0; }
    [data-bs-theme="dark"] body { color: #e2e8f0; }

    /* ── Zamonaviy ingichka scrollbar ──────────────────────────────
       Default qo'pol kulrang slayder o'rniga: ingichka (7px), yumaloq,
       yarim-shaffof Royal-Blue thumb — track ko'rinmas. Ko'k hero ustida
       ham, oq tana ustida ham nozik turadi; chetdan 2px nafas oladi. */
    html { scrollbar-width: thin; scrollbar-color: rgba(65,105,225,.4) transparent; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(65,105,225,.38); border-radius: 999px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(65,105,225,.6); background-clip: padding-box;
    }
    [data-bs-theme="dark"] html { scrollbar-color: rgba(147,180,255,.4) transparent; }
    [data-bs-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(147,180,255,.32); background-clip: padding-box; }
    [data-bs-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(147,180,255,.55); background-clip: padding-box; }
    /* Modal owns the close affordance, so the in-page back link is noise. */
    .fbs-detail-back { display: none !important; }
    /* Fill the modal card edge-to-edge instead of the standalone max-width. */
    .fbs-od { max-width: 100%; margin: 0; }

    /* Sticky action footer (Uzum-style): the main buttons stay pinned while
       the order content scrolls. The iframe is capped at 88vh by the parent;
       once content overflows, this footer sticks to the viewport bottom. An
       opaque bg keeps scrolling content from showing through. For short
       orders it just sits flush at the bottom. */
    body.fbs-embed #fbsActionsHost {
      position: sticky; bottom: 0; z-index: 5;
      background: #fff;
    }
    body.fbs-embed #fbsActionsHost:empty { display: none; }
    body.fbs-embed #fbsActionsHost .fbs-actions-bar { padding: 14px 32px 22px; }
    [data-bs-theme="dark"] body.fbs-embed #fbsActionsHost { background: #1a1d27; }
</style>
  {% block extra_css %}{% endblock %}
</head>
<body class="fbs-embed">
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
