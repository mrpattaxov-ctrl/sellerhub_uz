{# ── Bare layout for the order-detail page when shown inside a modal ──
   The orders list opens a single order in a centered modal via
   <iframe src="/fbs/<id>?embed=1">. That iframe must NOT carry the app
   chrome (sidebar/navbar/footer) — only the detail content. So instead of
   extending base.html, the detail template extends THIS minimal shell:
   same theme handling, Bootstrap (the cancel/IMEI modals need it) and the
   shared styles.css, transparent background so the parent modal card shows
   through, and the back-link hidden (the modal has its own × close).
   Blocks mirror base.html (extra_css / content) so the detail template
   renders unchanged in both layouts. #}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Sync theme from the same localStorage key base.html uses — the iframe
     is same-origin, so dark/light follows the parent automatically. #}
  <script>(function(){var t=localStorage.getItem('sh-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <title>{{ title|default('Buyurtma') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    html, body { background: transparent; }
    body { margin: 0; padding: 1.3rem 1.4rem 1.4rem; }
    [data-bs-theme="dark"] body { color: #e2e8f0; }
    /* Modal owns the close affordance, so the in-page back link is noise. */
    .fbs-detail-back { display: none !important; }
    /* Fill the modal card edge-to-edge instead of the standalone max-width. */
    .fbs-od { max-width: 100%; margin: 0; }

    /* Sticky action footer (Uzum-style): the two main buttons stay pinned to
       the bottom-right while the order content scrolls. The iframe is capped
       at 88vh by the parent; once content overflows, this footer sticks to
       the viewport bottom. An opaque bg + full-width top divider (negative
       margins bleed it to the card edges) keep scrolling content from
       showing through. For short orders it just sits flush at the bottom. */
    body.fbs-embed #fbsActionsHost {
      position: sticky; bottom: 0; z-index: 5;
      background: #fff; border-top: 1px solid #eaecf0;
      margin: .4rem -1.4rem -1.4rem; padding: 0 1.4rem;
    }
    body.fbs-embed #fbsActionsHost:empty { display: none; }
    body.fbs-embed #fbsActionsHost .fbs-actions-bar {
      border-top: none; margin-top: 0; padding: .75rem 0;
    }
    [data-bs-theme="dark"] body.fbs-embed #fbsActionsHost {
      background: #1a1d27; border-top-color: #2d3148;
    }
</style>
  {% block extra_css %}{% endblock %}
</head>
<body class="fbs-embed">
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
