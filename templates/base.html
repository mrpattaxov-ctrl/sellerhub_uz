<!doctype html>
<html lang="ru">
<head>
  <script>(function(){var t=localStorage.getItem('sh-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Склад + Uzum" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  {% block extra_css %}{% endblock %}
  <style>
    .table-responsive {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid #eaecf0;
      padding: 0;
      margin-bottom: 1.5rem;
      overflow: visible !important;
    }
    .table {
      margin-bottom: 0 !important;
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }
    .table thead th {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #f9fafb;
      color: #475467;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 24px;
      border-bottom: 1px solid #eaecf0;
      border-top: none !important;
      white-space: nowrap;
      vertical-align: middle;
    }
    .table tbody td {
      padding: 16px 24px;
      vertical-align: middle;
      border-bottom: 1px solid #eaecf0;
      font-size: 0.875rem;
      color: #101828;
    }
    .table tbody tr:last-child td {
      border-bottom: none;
    }
    .table-hover tbody tr:hover {
      background-color: #f9fafb;
    }
    .table .form-control,
    .table .form-select {
      border-radius: 8px;
      border: 1px solid #d0d5dd;
      padding: 8px 12px;
      font-size: 0.875rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    }
    .table .form-control:focus {
      box-shadow: 0 0 0 4px rgba(152, 162, 179, 0.14);
      border-color: #86b7fe;
    }
    .card {
      border-radius: 18px;
      overflow: hidden;
    }
    .card .card-img-top {
      border-radius: 18px 18px 0 0;
    }
    .top-sub-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 31px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid #d5d9eb;
      background: #f8fafc;
      color: #344054;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }
    .top-sub-chip:hover {
      color: #101828;
      background: #f2f4f7;
      border-color: #cfd4dc;
      transform: translateY(-1px);
    }
    .top-sub-chip--trial {
      background: #eff8ff;
      border-color: #b2ddff;
      color: #175cd3;
    }
    .top-sub-chip--active {
      background: #ecfdf3;
      border-color: #abefc6;
      color: #027a48;
    }
    .top-sub-chip--expired {
      background: #fef3f2;
      border-color: #fecdca;
      color: #b42318;
    }
    .top-sub-chip--unlimited {
      background: #f4f3ff;
      border-color: #d9d6fe;
      color: #6941c6;
    }
    .top-sub-chip__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .9;
      flex-shrink: 0;
    }
    /* ── Dark mode ── */
    [data-bs-theme="dark"] body { background: #0f1117; }
    [data-bs-theme="dark"] .table-responsive {
      background: #1a1d27; border-color: #2d3148;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    [data-bs-theme="dark"] .table thead th {
      background-color: #1e2130; color: #8892a4; border-bottom-color: #2d3148;
    }
    [data-bs-theme="dark"] .table tbody td { color: #e2e8f0; border-bottom-color: #2d3148; }
    [data-bs-theme="dark"] .table-hover tbody tr:hover { background-color: #1e2130; }
    [data-bs-theme="dark"] .table .form-control,
    [data-bs-theme="dark"] .table .form-select { border-color: #3a3f5c; }
    [data-bs-theme="dark"] .top-sub-chip { background:#1e2130; border-color:#3a3f5c; color:#94a3b8; }
    [data-bs-theme="dark"] .top-sub-chip:hover { background:#252a3f; border-color:#4a5070; color:#e2e8f0; }
    [data-bs-theme="dark"] .top-sub-chip--trial { background:#0f1e38; border-color:#1e4080; color:#60a5fa; }
    [data-bs-theme="dark"] .top-sub-chip--active { background:#0a2318; border-color:#166534; color:#4ade80; }
    [data-bs-theme="dark"] .top-sub-chip--expired { background:#2a0e0e; border-color:#7f1d1d; color:#f87171; }
    [data-bs-theme="dark"] .top-sub-chip--unlimited { background:#1a1040; border-color:#4c1d95; color:#a78bfa; }
    /* Top bar + sidebar overrides now live in static/styles.css so standalone pages
       (fetch.html, economics.html) can share the same styling. */
  </style>
</head>
<body
  data-is-admin="{{ '1' if current_user.is_authenticated and current_user.is_admin else '0' }}"
  data-subscription-href="{{ '/admin/subscriptions' if current_user.is_authenticated and current_user.is_admin else '/subscription' }}"
  data-subscription-label="{{ t.fetch_subscriptions_label if current_user.is_authenticated and current_user.is_admin else t.fetch_subscription_label }}"
  data-lang="{{ lang }}">
{% include "_topbar.html" %}

{% if current_user.is_authenticated and current_user.is_admin %}
<div id="token-warning-banner" style="display:none"
     class="alert alert-warning alert-dismissible mb-0 rounded-0 py-2 px-3 text-center" role="alert">
  <span id="token-warning-text"></span>
  <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
</div>
<script>
(function(){
  var _t = {
    not_set: {{ (t.token_not_set ~ ' <a href="/settings/api-key">' ~ t.token_add ~ '</a>') | tojson }},
    expired: {{ t.token_expired | tojson }},
    expires_soon_pre: {{ t.token_expires_soon | tojson }},
    expires_soon_post: {{ t.token_min | tojson }}
  };
  fetch('/api/user/api-key').then(r=>r.json()).then(d=>{
    const banner = document.getElementById('token-warning-banner');
    const text = document.getElementById('token-warning-text');
    if (!d.has_key) {
      text.innerHTML = _t.not_set;
      banner.style.display = '';
    } else if (d.is_expired) {
      text.innerHTML = _t.expired;
      banner.style.display = '';
    } else if (d.expires_soon) {
      const mins = Math.round(d.expires_in_seconds / 60);
      text.innerHTML = `${_t.expires_soon_pre} <b>${mins} ${_t.expires_soon_post}</b>`;
      banner.style.display = '';
    }
  }).catch(()=>{});
})();
</script>
{% endif %}

<main class="container-fluid px-3 py-4">
  {% block content %}{% endblock %}
</main>

<div class="modal fade" id="syncModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ t.sync_modal_title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="syncAll" checked>
              <label class="form-check-label" for="syncAll">{{ t.sync_all_pages }}</label>
            </div>
          </div>
          <div class="col-12">
            <div class="alert alert-secondary mb-0 small" id="syncResult" style="display:none;"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">{{ t.sync_close }}</button>
        <button class="btn btn-dark" id="btnDoSync">{{ t.sync_btn }}</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/uzum_ui.js?v=20260412b"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
